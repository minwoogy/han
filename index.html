<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08233f">
<title>POL-SEARCH GPS 기록기 v0.2</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#08233f;--blue:#0b66d6;--green:#168a4b;--red:#c43b3b;--gold:#d99b00;--bg:#eef3f8;--panel:#fff;--text:#152236}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px;background:linear-gradient(135deg,#06192f,#124a7c);color:#fff}
header h1{margin:0;font-size:19px} header p{margin:4px 0 0;font-size:12px;opacity:.85}
main{max-width:900px;margin:auto;padding:10px}
.card{background:#fff;border-radius:16px;box-shadow:0 5px 18px rgba(20,40,70,.09);margin-bottom:10px;overflow:hidden}
.pad{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
button{border:0;border-radius:11px;padding:12px 10px;font-weight:800;cursor:pointer}
.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.soft{background:#e9eff6;color:#17324f}.gold{background:#fff0bd;color:#6c4b00}
button:disabled{opacity:.45}
#map{height:46vh;min-height:320px;background:#dce6ef}
.status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:#f2f6fa;font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;background:#7b8795}.dot.on{background:#19a75a;box-shadow:0 0 0 5px rgba(25,167,90,.15)}.dot.err{background:#d33}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.stat{background:#f4f7fa;border-radius:11px;padding:9px;text-align:center}
.stat b{font-size:17px;display:block}.stat small{font-size:10px;color:#657386}
.log{max-height:155px;overflow:auto;font-size:11px;background:#081828;color:#d9f1ff;border-radius:11px;padding:9px;white-space:pre-wrap}
.note{font-size:11px;line-height:1.5;color:#5e6b79;background:#f6f8fb;border-radius:11px;padding:10px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8f2ff;color:#0754a4;font-size:10px;font-weight:800}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>POL-SEARCH GPS 기록기 v0.2</h1>
  <p>수색대원 개인 휴대전화의 실제 위치를 기록하는 단말 시연용</p>
</header>

<main>
<section class="card pad">
  <div class="grid2">
    <div><label>작전명</label><input id="mission" value="망우산 미귀가자 수색 시연"></div>
    <div><label>호출명</label><input id="callsign" value="시험대원-01"></div>
  </div>
  <div class="grid2" style="margin-top:8px">
    <div><label>소속/팀</label><input id="team" value="POL-SEARCH 시험팀"></div>
    <div><label>기록 최소간격</label>
      <select id="minInterval"><option value="3000">3초</option><option value="5000" selected>5초</option><option value="10000">10초</option></select>
    </div>
  </div>
  <div class="status" style="margin-top:10px"><span id="dot" class="dot"></span><b id="status">대기 중</b><span id="secure" class="badge"></span></div>
  <div class="grid2" style="margin-top:9px">
    <button id="start" class="green">수색 시작</button>
    <button id="stop" class="red" disabled>수색 종료</button>
  </div>
  <div class="grid2" style="margin-top:8px">
    <button id="current" class="primary">현재 위치 1회 확인</button>
    <button id="clear" class="soft">기록 초기화</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="count">0</b><small>위치점</small></div>
    <div class="stat"><b id="distance">0 m</b><small>이동거리</small></div>
    <div class="stat"><b id="accuracy">-</b><small>최근 정확도</small></div>
    <div class="stat"><b id="elapsed">00:00</b><small>기록시간</small></div>
  </div>
</section>

<section class="card">
  <div id="map"></div>
</section>

<section class="card pad">
  <div class="grid2">
    <button id="geojson" class="primary">GeoJSON 저장</button>
    <button id="gpx" class="primary">GPX 저장</button>
  </div>
  <div class="grid2" style="margin-top:8px">
    <button id="csv" class="soft">CSV 저장</button>
    <label style="margin:0"><input id="timelineFile" type="file" accept=".json,application/json" hidden><button type="button" id="timelineBtn" class="gold" style="width:100%">구글 타임라인 JSON 불러오기</button></label>
  </div>
  <p class="note">
    이 파일은 서버 없이 현재 휴대전화 안에 위치를 저장합니다. 화면이 꺼지거나 브라우저가 백그라운드로 전환되면 기록이 중단될 수 있습니다.
    현장형 버전에서는 안드로이드 앱의 백그라운드 위치 서비스로 보완해야 합니다.
  </p>
  <div id="log" class="log">앱 준비 완료</div>
</section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
let points=[], watchId=null, startedAt=null, timer=null, lastAccepted=0;
let map=null,line=null,markers=[];

function log(msg){$('log').textContent='['+new Date().toLocaleTimeString()+'] '+msg+'\n'+$('log').textContent}
function initMap(){
  if(!window.L){log('지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');return}
  map=L.map('map').setView([37.5986,127.1137],15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  line=L.polyline([], {weight:5}).addTo(map);
}
function secureLabel(){
  $('secure').textContent = window.isSecureContext ? '보안 연결' : '비보안/로컬 파일';
}
function hav(a,b){
 const R=6371000, p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;
 const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));
}
function totalDistance(){
 let d=0;for(let i=1;i<points.length;i++)d+=hav(points[i-1],points[i]);return d;
}
function redraw(){
 $('count').textContent=points.length;
 const d=totalDistance();$('distance').textContent=d<1000?Math.round(d)+' m':(d/1000).toFixed(2)+' km';
 if(points.length)$('accuracy').textContent=Math.round(points.at(-1).accuracy)+' m';
 if(line){line.setLatLngs(points.map(p=>[p.lat,p.lng]));}
 markers.forEach(m=>m.remove());markers=[];
 if(map&&points.length){
   const p=points.at(-1);
   const m=L.circleMarker([p.lat,p.lng],{radius:7,weight:3}).addTo(map).bindPopup(
      `${$('callsign').value}<br>정확도 ±${Math.round(p.accuracy)}m<br>${new Date(p.timestamp).toLocaleTimeString()}`
   );
   markers.push(m); map.setView([p.lat,p.lng],Math.max(map.getZoom(),17));
 }
 localStorage.setItem('polsearch_points',JSON.stringify(points));
}
function acceptPosition(pos, force=false){
 const now=Date.now(), min=+$('minInterval').value;
 if(!force && now-lastAccepted<min)return;
 const c=pos.coords;
 const p={lat:c.latitude,lng:c.longitude,accuracy:c.accuracy,altitude:c.altitude,speed:c.speed,heading:c.heading,timestamp:pos.timestamp||now};
 points.push(p);lastAccepted=now;redraw();
 $('status').textContent='기록 중 · 최근 위치 수신 '+new Date().toLocaleTimeString();
 $('dot').className='dot on';
 log(`위치 수신: ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)} / 정확도 ±${Math.round(p.accuracy)}m`);
}
function geoError(e){
 $('dot').className='dot err';$('status').textContent='위치 오류: '+e.message;
 log(`위치 오류(${e.code}): ${e.message}`);
 if(!window.isSecureContext)log('브라우저 위치기능은 HTTPS에서 가장 안정적으로 동작합니다.');
}
function start(){
 if(!navigator.geolocation){geoError({code:0,message:'이 브라우저는 위치기능을 지원하지 않습니다.'});return}
 startedAt=Date.now();$('start').disabled=true;$('stop').disabled=false;$('dot').className='dot on';$('status').textContent='GPS 연결 중';
 watchId=navigator.geolocation.watchPosition(p=>acceptPosition(p,false),geoError,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 timer=setInterval(()=>{
   const s=Math.floor((Date.now()-startedAt)/1000);$('elapsed').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 },1000);
 log('수색 기록 시작');
}
function stop(){
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;
 clearInterval(timer);$('start').disabled=false;$('stop').disabled=true;$('dot').className='dot';$('status').textContent='기록 종료 · 파일 저장 가능';
 log('수색 기록 종료');
}
function download(name,type,text){
 const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function meta(){return {mission:$('mission').value,callsign:$('callsign').value,team:$('team').value,exportedAt:new Date().toISOString()}}
function exportGeo(){
 const obj={type:'FeatureCollection',properties:meta(),features:[
  {type:'Feature',properties:meta(),geometry:{type:'LineString',coordinates:points.map(p=>[p.lng,p.lat,p.altitude||0])}},
  ...points.map((p,i)=>({type:'Feature',properties:{...p,index:i+1,...meta()},geometry:{type:'Point',coordinates:[p.lng,p.lat,p.altitude||0]}}))
 ]};
 download(`POL_SEARCH_${$('callsign').value}.geojson`,'application/geo+json',JSON.stringify(obj,null,2));
}
function exportCSV(){
 const head='mission,callsign,team,index,timestamp,latitude,longitude,accuracy_m,altitude_m,speed_mps,heading\n';
 const rows=points.map((p,i)=>[
   $('mission').value,$('callsign').value,$('team').value,i+1,new Date(p.timestamp).toISOString(),p.lat,p.lng,p.accuracy,p.altitude??'',p.speed??'',p.heading??''
 ].map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
 download(`POL_SEARCH_${$('callsign').value}.csv`,'text/csv;charset=utf-8','\ufeff'+head+rows);
}
function exportGPX(){
 const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
 const seg=points.map(p=>`<trkpt lat="${p.lat}" lon="${p.lng}">${p.altitude!=null?`<ele>${p.altitude}</ele>`:''}<time>${new Date(p.timestamp).toISOString()}</time><extensions><accuracy>${p.accuracy}</accuracy></extensions></trkpt>`).join('');
 const xml=`<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="POL-SEARCH" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>${esc($('mission').value)}</name><time>${new Date().toISOString()}</time></metadata><trk><name>${esc($('callsign').value)}</name><desc>${esc($('team').value)}</desc><trkseg>${seg}</trkseg></trk></gpx>`;
 download(`POL_SEARCH_${$('callsign').value}.gpx`,'application/gpx+xml',xml);
}
function parseTimeline(data){
 const found=[];
 function push(lat,lng,ts,acc){
   lat=Number(lat);lng=Number(lng);
   if(Math.abs(lat)>90)lat/=1e7;if(Math.abs(lng)>180)lng/=1e7;
   if(Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180)
     found.push({lat,lng,accuracy:Number(acc)||0,altitude:null,speed:null,heading:null,timestamp:ts?new Date(ts).getTime():Date.now()});
 }
 function walk(o){
   if(!o||typeof o!=='object')return;
   if(Array.isArray(o)){o.forEach(walk);return}
   if(o.latitudeE7!=null&&o.longitudeE7!=null)push(o.latitudeE7,o.longitudeE7,o.timestamp||o.timestampMs,o.accuracy);
   if(o.latLng&&typeof o.latLng==='string'){
     const m=o.latLng.match(/([-+]?\d+(?:\.\d+)?)°?\s*,\s*([-+]?\d+(?:\.\d+)?)°?/);
     if(m)push(m[1],m[2],o.time||o.timestamp,o.accuracyMeters);
   }
   if(o.latitude!=null&&o.longitude!=null)push(o.latitude,o.longitude,o.timestamp||o.time,o.accuracy);
   Object.values(o).forEach(walk);
 }
 walk(data);
 found.sort((a,b)=>a.timestamp-b.timestamp);
 return found.filter((p,i,a)=>!i||p.lat!==a[i-1].lat||p.lng!==a[i-1].lng||p.timestamp!==a[i-1].timestamp);
}
$('timelineBtn').onclick=()=>$('timelineFile').click();
$('timelineFile').onchange=async e=>{
 try{
   const data=JSON.parse(await e.target.files[0].text());const imported=parseTimeline(data);
   if(!imported.length)throw new Error('지원 가능한 위치좌표를 찾지 못했습니다.');
   points=imported;redraw();if(map)map.fitBounds(line.getBounds(),{padding:[20,20]});
   log(`구글 타임라인 JSON에서 ${imported.length}개 위치점 불러오기 완료`);
 }catch(err){log('타임라인 불러오기 실패: '+err.message);alert(err.message)}
};
$('start').onclick=start;$('stop').onclick=stop;
$('current').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>acceptPosition(p,true),geoError,{enableHighAccuracy:true,timeout:20000,maximumAge:0}):geoError({message:'위치 미지원'});
$('clear').onclick=()=>{if(confirm('저장된 위치기록을 모두 삭제할까요?')){stop();points=[];localStorage.removeItem('polsearch_points');redraw();$('elapsed').textContent='00:00';log('기록 초기화')}}
$('geojson').onclick=exportGeo;$('csv').onclick=exportCSV;$('gpx').onclick=exportGPX;
try{points=JSON.parse(localStorage.getItem('polsearch_points')||'[]')}catch{}
secureLabel();initMap();setTimeout(redraw,300);
</script>
</body>
</html>
