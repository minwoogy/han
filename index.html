<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>POL-SEARCH 대원용 v0.5</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#eef3f8;color:#152236}
header{padding:14px 16px;background:linear-gradient(135deg,#06192f,#124a7c);color:#fff}header h1{margin:0;font-size:19px}header p{margin:4px 0 0;font-size:12px;opacity:.85}
main{max-width:900px;margin:auto;padding:10px}.card{background:#fff;border-radius:16px;box-shadow:0 5px 18px rgba(20,40,70,.09);margin-bottom:10px;overflow:hidden}.pad{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}button{border:0;border-radius:11px;padding:12px 10px;font-weight:800;cursor:pointer}button:disabled{opacity:.45}
.green{background:#168a4b;color:#fff}.red{background:#c43b3b;color:#fff}.primary{background:#0b66d6;color:#fff}.soft{background:#e9eff6;color:#17324f}.gold{background:#fff0bd;color:#6c4b00}
#map{height:48vh;min-height:340px}.status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:#f2f6fa;font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;background:#7b8795}.dot.on{background:#19a75a;box-shadow:0 0 0 5px rgba(25,167,90,.15)}.dot.err{background:#d33}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.stat{background:#f4f7fa;border-radius:11px;padding:9px;text-align:center}.stat b{font-size:17px;display:block}.stat small{font-size:10px;color:#657386}
.log{max-height:135px;overflow:auto;font-size:11px;background:#081828;color:#d9f1ff;border-radius:11px;padding:9px;white-space:pre-wrap}.note{font-size:11px;line-height:1.5;color:#5e6b79;background:#f6f8fb;border-radius:11px;padding:10px}.badge{padding:3px 7px;border-radius:999px;background:#e8f2ff;color:#0754a4;font-size:10px;font-weight:800}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header><h1>POL-SEARCH 대원용 v0.5</h1><p>GPS 실시간 기록 · Firebase 자동 업로드 · 통신복구 재전송</p></header>
<main>
<section class="card pad">
<div class="grid2"><div><label>작전번호</label><input id="missionId" value="TEST-001"></div><div><label>호출명</label><input id="callsign" value="시험대원-01"></div></div>
<div class="grid2" style="margin-top:8px"><div><label>소속/팀</label><input id="team" value="POL-SEARCH 시험팀"></div><div><label>기록 간격</label><select id="minInterval"><option value="3000">3초</option><option value="5000" selected>5초</option><option value="10000">10초</option></select></div></div>
<div class="status" style="margin-top:10px"><span id="dot" class="dot"></span><b id="status">Firebase 연결 준비 중</b><span id="authBadge" class="badge">인증 대기</span></div>
<div class="grid2" style="margin-top:9px"><button id="start" class="green">수색 시작</button><button id="stop" class="red" disabled>수색 종료</button></div>
<div class="grid2" style="margin-top:8px"><button id="current" class="primary">현재 위치 확인</button><button id="fit" class="soft">전체 경로 보기</button></div>
<div class="stats"><div class="stat"><b id="count">0</b><small>위치점</small></div><div class="stat"><b id="distance">0 m</b><small>이동거리</small></div><div class="stat"><b id="accuracy">-</b><small>최근 정확도</small></div><div class="stat"><b id="pending">0</b><small>미전송</small></div></div>
</section>
<section class="card"><div id="map"></div></section>
<section class="card pad"><div class="grid2"><button id="share" class="primary">예비파일 공유</button><button id="clear" class="gold">기록 초기화</button></div>
<p class="note">통신 가능 시 위치점이 자동 업로드됩니다. 실패 위치는 휴대전화에 임시저장되고 온라인 복구 시 재전송됩니다.</p><div id="log" class="log">앱 초기화 중...</div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={"apiKey": "AIzaSyCPb0lXEII-WBHu30J_qr3Mr34IbRWPLgc", "authDomain": "polsearch112.firebaseapp.com", "databaseURL": "https://polsearch112-default-rtdb.asia-southeast1.firebasedatabase.app", "projectId": "polsearch112", "storageBucket": "polsearch112.firebasestorage.app", "messagingSenderId": "775201329579", "appId": "1:775201329579:web:20eb296f51ca0118d042ee", "measurementId": "G-2CFSKEM4VN"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database(),$=id=>document.getElementById(id);
let uid=null,map=null,pathLine=null,currentMarker=null,accuracyCircle=null,watchId=null,lastAccepted=0;
let points=JSON.parse(localStorage.getItem('polsearch_points_v05')||'[]');
let queue=JSON.parse(localStorage.getItem('polsearch_queue')||'[]');
function log(m){$('log').textContent='['+new Date().toLocaleTimeString()+'] '+m+'\n'+$('log').textContent}
function safeKey(s){return String(s||'').trim().replace(/[.#$\[\]\/]/g,'_').slice(0,80)}
function initMap(){map=new google.maps.Map($('map'),{center:{lat:37.60075,lng:127.11375},zoom:15,mapTypeId:'terrain',streetViewControl:false});pathLine=new google.maps.Polyline({map,strokeColor:'#0b66d6',strokeWeight:5});redraw()}
window.initMap=initMap;
auth.onAuthStateChanged(async user=>{if(user){uid=user.uid;$('authBadge').textContent='익명 인증완료';$('status').textContent='자동업로드 준비 완료';log('Firebase 익명 인증 완료');await flushQueue()}else{try{await auth.signInAnonymously()}catch(e){$('dot').className='dot err';$('status').textContent='인증 실패';log(e.message)}}});
function hav(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function totalDistance(){let d=0;for(let i=1;i<points.length;i++)d+=hav(points[i-1],points[i]);return d}
function redraw(){$('count').textContent=points.length;$('pending').textContent=queue.length;const d=totalDistance();$('distance').textContent=d<1000?Math.round(d)+' m':(d/1000).toFixed(2)+' km';if(points.length)$('accuracy').textContent=Math.round(points.at(-1).accuracy)+' m';if(pathLine)pathLine.setPath(points.map(p=>({lat:p.lat,lng:p.lng})));if(points.length&&map){const p=points.at(-1),pos={lat:p.lat,lng:p.lng};if(!currentMarker)currentMarker=new google.maps.Marker({position:pos,map});else currentMarker.setPosition(pos);if(!accuracyCircle)accuracyCircle=new google.maps.Circle({map,center:pos,radius:p.accuracy,strokeColor:'#0b66d6',fillColor:'#0b66d6',fillOpacity:.12});else{accuracyCircle.setCenter(pos);accuracyCircle.setRadius(p.accuracy)}}localStorage.setItem('polsearch_points_v05',JSON.stringify(points));localStorage.setItem('polsearch_queue',JSON.stringify(queue))}
function missionPath(){return 'missions/'+safeKey($('missionId').value)+'/members/'+uid}
async function ensureMeta(status='active'){await db.ref(missionPath()+'/meta').update({callsign:$('callsign').value,team:$('team').value,missionId:$('missionId').value,uid,status,lastSeen:firebase.database.ServerValue.TIMESTAMP})}
async function uploadPoint(p){if(!uid)throw new Error('인증 대기 중');await ensureMeta('active');const key=String(p.timestamp)+'_'+Math.random().toString(36).slice(2,7);await db.ref(missionPath()+'/points/'+key).set(p);await db.ref(missionPath()+'/latest').set(p)}
async function flushQueue(){if(!uid||!navigator.onLine||!queue.length)return;const remain=[];for(const item of queue){try{await uploadPoint(item)}catch(e){remain.push(item)}}queue=remain;redraw();if(!queue.length)log('미전송 위치 재전송 완료')}
async function acceptPosition(pos,force=false){const now=Date.now(),min=+$('minInterval').value;if(!force&&now-lastAccepted<min)return;lastAccepted=now;const c=pos.coords,p={lat:c.latitude,lng:c.longitude,accuracy:c.accuracy,altitude:c.altitude,speed:c.speed,heading:c.heading,timestamp:pos.timestamp||now};points.push(p);redraw();$('dot').className='dot on';$('status').textContent='기록 중 · 자동업로드';try{await uploadPoint(p);log('위치 자동업로드 완료')}catch(e){queue.push(p);redraw();log('업로드 보류: '+e.message)}}
function geoError(e){$('dot').className='dot err';$('status').textContent='위치 오류: '+e.message;log(e.message)}
async function start(){if(!uid){alert('Firebase 인증이 완료될 때까지 잠시 기다려주세요.');return}if(!$('missionId').value.trim()||!$('callsign').value.trim()){alert('작전번호와 호출명을 입력하세요.');return}$('start').disabled=true;$('stop').disabled=false;await ensureMeta('active');watchId=navigator.geolocation.watchPosition(p=>acceptPosition(p),geoError,{enableHighAccuracy:true,maximumAge:0,timeout:20000});log('수색 시작')}
async function stop(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;$('start').disabled=false;$('stop').disabled=true;$('dot').className='dot';$('status').textContent='수색 종료';try{await db.ref(missionPath()+'/meta').update({status:'finished',finishedAt:firebase.database.ServerValue.TIMESTAMP,lastSeen:firebase.database.ServerValue.TIMESTAMP})}catch(e){log(e.message)}await flushQueue();log('수색 종료 및 최종 전송')}
function buildJSON(){return {type:'FeatureCollection',properties:{missionId:$('missionId').value,callsign:$('callsign').value,team:$('team').value},features:[{type:'Feature',geometry:{type:'LineString',coordinates:points.map(p=>[p.lng,p.lat,p.altitude||0])},properties:{}},...points.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:[p.lng,p.lat,p.altitude||0]},properties:p}))]}}
async function share(){const text=JSON.stringify(buildJSON(),null,2);const filename='POL_SEARCH_'+safeKey($('callsign').value)+'.json';const file=new File([text],filename,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'POL-SEARCH 경로'});else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=filename;a.click()}}
$('start').onclick=start;$('stop').onclick=stop;$('current').onclick=()=>navigator.geolocation.getCurrentPosition(p=>acceptPosition(p,true),geoError,{enableHighAccuracy:true});$('fit').onclick=()=>{if(!points.length)return;const b=new google.maps.LatLngBounds();points.forEach(p=>b.extend({lat:p.lat,lng:p.lng}));map.fitBounds(b,50)};$('share').onclick=share;$('clear').onclick=()=>{if(confirm('휴대전화 기록을 초기화할까요?')){points=[];queue=[];redraw();if(pathLine)pathLine.setPath([])}};window.addEventListener('online',flushQueue);redraw();
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD1uobdsxhk2lwUs9eawWvYvReE_SqoIZg&callback=initMap&v=weekly"></script>
</body></html>
